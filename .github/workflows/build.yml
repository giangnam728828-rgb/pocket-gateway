name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "把 APK 上传到该 Release（留空只构建）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu-latest runner 已预装 Android SDK，
      # 但不一定有 compileSdk 35。直接用 sdkmanager 补齐所需组件，
      # 避免使用已失效的 setup-android action（它会安装废弃的 tools 包而失败）。
      - name: Ensure Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      # 从 Secrets 还原签名 keystore（仓库中不存放密钥文件与密码）
      # 注意：if 条件里不能直接引用 secrets，改为在脚本内判断环境变量
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置签名 Secrets，本次构建将使用默认 debug 签名"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/pocketgateway.jks
          {
            echo "storeFile=keystore/pocketgateway.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties
          echo "签名 keystore 已还原"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-gateway-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 手动触发时可直接把 APK 挂到指定 Release（无需登录下载 Actions artifact）
      - name: Upload APKs to release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "${{ github.repository }}" \
                 --title "PocketGateway $TAG" --prerelease --notes "CI build"
          gh release upload "$TAG" -R "${{ github.repository }}" \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk \
            --clobber

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: pocket-gateway-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 读取版本号，作为 Release 的 tag 与名称
      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 删除已存在的同名 Release（连同其 asset），确保每次发布都是全新且唯一
      - name: Delete existing release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

      # 自动发布 Release（main 分支推送与 tag 推送均发布）
      # 使用仓库内置 GITHUB_TOKEN（contents: write），具备删除/上传 asset 权限
      - name: Publish Release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PocketGateway v${{ steps.ver.outputs.version }}
          body: |
            自动构建发布。
            - 版本：${{ steps.ver.outputs.version }}
            - 提交：${{ github.sha }}
            - 签名：固定 keystore（可直接覆盖安装，无需卸载）
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
